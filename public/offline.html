<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3D5A4C" />
    <title>2gather — Çevrimdışı</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', system-ui, sans-serif;
        background: #F5F3EE;
        color: #1A1A1A;
        text-align: center;
        padding: 16px;
      }
      .logo { width: 72px; height: 72px; border-radius: 16px; margin: 0 auto 16px; }
      h1 { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #6B6B6B; }
      button {
        font: inherit; font-weight: 600; color: #FFFFFF; background: #3D5A4C;
        border: none; border-radius: 10px; padding: 10px 20px; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #141614; color: #ECEDE9; }
        p { color: #B0B4AD; }
        button { background: #7DB095; color: #0E1A13; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/pwa-192x192.png" alt="2gather" />
      <h1>2gather</h1>
      <p>İnternet bağlantınız yok.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
