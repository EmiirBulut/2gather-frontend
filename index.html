<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/masked-icon.svg" color="#3D5A4C" />
    <meta name="theme-color" content="#3D5A4C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2gather — Birlikte Planlayın</title>
    <script>
      // Apply the saved theme before first paint (same logic as src/lib/theme.ts)
      try {
        var stored = JSON.parse(localStorage.getItem('ui-preferences') || '{}')
        var preference = (stored.state && stored.state.themePreference) || 'system'
        var isDark = preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
